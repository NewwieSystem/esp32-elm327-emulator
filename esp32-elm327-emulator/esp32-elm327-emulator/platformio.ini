; GhostCar - ESP32 ELM327 OBD-II emulator
;
;   pio run -e cyd        -t upload    Cheap Yellow Display (ESP32-2432S028R, 2.8" ILI9341 + XPT2046)
;   pio run -e cyd-invert -t upload    same board, panel batch that shows wrong colours without inversion
;   pio run -e esp32dev   -t upload    any ESP32 (WROOM / WROVER) without a screen
;   pio device monitor                 serial console, type "help"
;
; Car profile and connection (Bluetooth Classic / BLE / Wi-Fi) are chosen at runtime on the SETUP
; page or over serial - see README.md.   make -C test   runs the protocol tests on a PC (no board).

[platformio]
default_envs = cyd

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; a crash prints file:line instead of bare addresses
upload_speed = 921600
; Bluetooth Classic + BLE + Wi-Fi + the screen do not fit the default 1.2 MB app slot.
; No OTA needed, so use the 3 MB single-app layout.
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev

[cyd_common]
board = esp32dev
lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  ; the registry copy is an old release without begin(SPIClass&); the CYD needs the GitHub version
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
  ${env.build_flags}
  -DGHOSTCAR_CYD
  -DUSER_SETUP_LOADED=1
  -DDISABLE_ALL_LIBRARY_WARNINGS
  -DILI9341_2_DRIVER=1
  ; the panel's native size; the UI runs it in landscape (setRotation(1))
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DUSE_HSPI_PORT
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  ; 40 MHz: the rate every CYD panel takes reliably (at 80 MHz some units show torn / shifted pictures).
  ; The ESP32 can only do 80 / 40 / 26.7 ... MHz (80 MHz / integer).
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT7=1

; panel shows correct colours as-is
[env:cyd]
extends = cyd_common
build_flags =
  ${cyd_common.build_flags}
  -DTFT_INVERSION_OFF=1

; panel batch whose colours are wrong (negative) without inversion
[env:cyd-invert]
extends = cyd_common
build_flags =
  ${cyd_common.build_flags}
  -DTFT_INVERSION_ON=1
